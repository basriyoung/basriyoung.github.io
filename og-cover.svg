  <line x1="762" y1="228" x2="1120" y2="228" stroke="#1e293b" stroke-width="1.2"/>

  <g font-family="JetBrains Mono" font-size="14">
    <text x="786" y="262" fill="#34d399">$ candidate.status()</text>
